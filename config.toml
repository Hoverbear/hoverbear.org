title = "Hoverbear"
author = "Ana Hobden"
description = "A computer scientist working in open source towards a more hopeful future."
default_language = "en"
base_url = "https://hoverbear.org"
generate_feeds = true
feed_filenames = ["rss.xml"]
compile_sass = true
build_search_index = true

taxonomies = [
    { name = "tags", feed = true },
]

ignored_content = [ "*/target/debug/*", "*/target/release/*" ]

[markdown]
render_emoji = true
smart_punctuation = false
definition_list = true
lazy_async_image = false # So we can have rich alt text
bottom_footnotes = true
github_alerts = true
insert_anchor_links = "heading"
external_links_target_blank = true

[markdown.highlighting]
style = "class"
theme = "catppuccin-macchiato"


[extra]
author = "Ana Hobden"
github = "hoverbear"
bluesky = "hoverbear.org"
twitter = "a_hoverbear"
mastodon = "@ana@hachyderm.io"
mastodon_link = "https://hachyderm.io/@ana"
email = "operator@hoverbear.org"

[extra.cover]
path = "cover.jpg"
photographer = "Kobi Li"
source = "https://unsplash.com/photos/-N0cgDSF_MI"

[extra.logo]
path = "logo.svg"
artist = "Lisa Dentz"
source = "https://www.lisadentz.com/"
